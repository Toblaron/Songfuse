[project]
name = "songfuse"
version = "0.1.0"
description = "AI-assisted tool that fuses two songs with a seamless, beat-matched, harmonically aware transition."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Songfuse" }]
dependencies = [
    "librosa>=0.10.1",
    "soundfile>=0.12.1",
    "numpy>=1.24",
    "scipy>=1.10",
    "typer>=0.12",
    "rich>=13.7",
    "pyloudnorm>=0.1.1",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
stems = ["demucs>=4.0.1", "torch>=2.1"]
ai = ["audiocraft>=1.3.0", "torch>=2.1", "torchaudio>=2.1"]
dev = ["pytest>=8"]

[project.scripts]
songfuse = "songfuse.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["songfuse"]

[tool.hatch.build.targets.wheel.force-include]
"songfuse/web" = "songfuse/web"
